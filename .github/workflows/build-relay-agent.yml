name: Build BitBrowser Relay Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "relay-agent-v*"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: windows-latest
            label: windows-x64
    defaults:
      run:
        working-directory: backend/scripts
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyinstaller pyqt5 websockets httpx

      - name: Build
        run: python build_gui.py

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: BitBrowserRelayAgent-${{ matrix.label }}
          path: backend/scripts/dist/*.zip

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BitBrowserRelayAgent-${{ matrix.label }}
          path: backend/scripts/dist/BitBrowserRelayAgent.exe

  release:
    if: startsWith(github.ref, 'refs/tags/relay-agent-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename exe
        run: mv artifacts/BitBrowserRelayAgent-windows-x64/BitBrowserRelayAgent.exe artifacts/BitBrowserRelayAgent-windows-x64.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BitBrowserRelayAgent-macos-arm64/*.zip
            artifacts/BitBrowserRelayAgent-macos-x86_64/*.zip
            artifacts/BitBrowserRelayAgent-windows-x64.exe
